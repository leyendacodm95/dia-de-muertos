<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Recorrido Virtual - Día de Muertos</title>
    <!-- Fuentes Locales 100% Offline (Mantiene idéntico el aspecto visual sin internet) -->
    <link rel="stylesheet" href="./fonts/local_fonts.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com"  />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800;900&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet" />
    
    <!-- MediaPipe Face Mesh & Camera Utils Scripts Locales 100% Offline -->
    <script src="mediapipe/camera_utils.js"></script>
    <script src="mediapipe/face_mesh.js"></script>
    <script type="module"  src="./assets/index-C4Se4o4d.js"></script>
    <link rel="stylesheet"  href="./assets/index-DJAnZKU7.css">
  </head>
  <body class="bg-black text-white min-h-screen overflow-hidden select-none">
    <!-- Pantalla de carga: Adaptable para PC (16:9) y Móvil/Android (vertical) -->
    <div id="html-splash-screen" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background-color:#000000;z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);overflow:hidden;">
      <picture style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;">
        <source media="(min-width: 850px) and (orientation: landscape)" srcset="Pantalla%20de%20carga%20pc.jpg" />
        <img id="splash-img" src="Pantalla%20de%20carga.jpg" alt="Cargando..." />
      </picture>
      <script>
        (function() {
          var isMobileOrAndroid = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth < 850 && window.innerHeight > window.innerWidth);
          var img = document.getElementById('splash-img');
          if (img && !isMobileOrAndroid && window.innerWidth >= 850) {
            img.src = 'Pantalla%20de%20carga%20pc.jpg';
          }
        })();
      </script>
      
      <!-- Texto animado de carga adaptable a Android y PC -->
      <div style="margin-top:auto;margin-bottom:10vh;background:rgba(18, 10, 5, 0.85);padding:12px 24px;border-radius:26px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,140,0,0.35);box-shadow:0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255,117,24,0.3);max-width:90vw;">
        <h1 style="color:#ffffff;font-family:'Space Grotesk', system-ui, -apple-system, sans-serif;font-size:clamp(15px, 4.5vw, 22px);margin:0;font-weight:600;letter-spacing:1px;animation:text-pulse 1.5s infinite;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;">
          <span>Cargando aplicación</span><span class="dots"></span>
        </h1>
      </div>

      <style>#html-splash-screen picture,#splash-img{object-fit:cover;object-position:center;z-index:-1;width:100%;height:100%;animation:2s ease-in-out infinite pulse-fade;position:absolute;top:0;left:0}@media (width>=850px) and (orientation:landscape){#html-splash-screen{background-color:#0d092d}#splash-img{object-fit:contain;object-position:center 54%;width:100%;height:100%;transform:translateY(14px)}}@keyframes pulse-fade{0%{opacity:1;transform:scale(1)}50%{opacity:.88;transform:scale(1.02)}to{opacity:1;transform:scale(1)}}@keyframes text-pulse{0%{opacity:.6}50%{opacity:1;text-shadow:0 0 15px #ff9632e6}to{opacity:.6}}@keyframes loading-dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}to{content:""}}.dots:after{content:"";animation:1.5s step-end infinite loading-dots}</style>
    </div>

    <div id="root" class="h-full"></div>
    <script>
      // Temporizador de seguridad: Si por alguna razón la red tarda, quitar pantalla de carga automáticamente a los 2.5s
      setTimeout(function() {
        var s = document.getElementById('html-splash-screen');
        if (s) {
          s.style.opacity = '0';
          setTimeout(function() {
            if (s && s.parentNode) s.parentNode.removeChild(s);
          }, 600);
        }
      }, 2500);
    </script>
  </body>
</html>
